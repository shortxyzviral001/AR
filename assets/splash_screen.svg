<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600">
  <defs>
    <!-- Deep space gradient background -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0d1b3e"/>
      <stop offset="50%" stop-color="#060e24"/>
      <stop offset="100%" stop-color="#020510"/>
    </radialGradient>
    <!-- Nebula glow -->
    <radialGradient id="nebula1" cx="30%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#1a0a3e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d1b3e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="70%" cy="55%" r="30%">
      <stop offset="0%" stop-color="#0a2a4e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#060e24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula3" cx="50%" cy="30%" r="25%">
      <stop offset="0%" stop-color="#2a0a3e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d1b3e" stop-opacity="0"/>
    </radialGradient>
    <!-- Title glow -->
    <filter id="titleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Subtle star glow -->
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <!-- Ship engine glow -->
    <radialGradient id="engineGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#35e6c9" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#7c5cff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2a1a5c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="600" fill="url(#bgGrad)"/>

  <!-- Nebula clouds -->
  <rect width="1024" height="600" fill="url(#nebula1)"/>
  <rect width="1024" height="600" fill="url(#nebula2)"/>
  <rect width="1024" height="600" fill="url(#nebula3)"/>

  <!-- Star field - background layer (small, dim) -->
  <g opacity="0.3">
    <circle cx="45" cy="30" r="0.6" fill="#aaccff"/>
    <circle cx="120" cy="80" r="0.5" fill="#ffffff"/>
    <circle cx="190" cy="45" r="0.7" fill="#aaccff"/>
    <circle cx="260" cy="110" r="0.5" fill="#ffeedd"/>
    <circle cx="340" cy="25" r="0.6" fill="#ffffff"/>
    <circle cx="410" cy="90" r="0.5" fill="#aaccff"/>
    <circle cx="500" cy="55" r="0.7" fill="#ffffff"/>
    <circle cx="580" cy="35" r="0.5" fill="#ffeedd"/>
    <circle cx="650" cy="95" r="0.6" fill="#aaccff"/>
    <circle cx="730" cy="20" r="0.5" fill="#ffffff"/>
    <circle cx="810" cy="70" r="0.7" fill="#aaccff"/>
    <circle cx="890" cy="50" r="0.5" fill="#ffffff"/>
    <circle cx="960" cy="85" r="0.6" fill="#ffeedd"/>
    <circle cx="80" cy="150" r="0.5" fill="#aaccff"/>
    <circle cx="170" cy="180" r="0.6" fill="#ffffff"/>
    <circle cx="320" cy="170" r="0.5" fill="#ffeedd"/>
    <circle cx="450" cy="155" r="0.7" fill="#ffffff"/>
    <circle cx="580" cy="175" r="0.5" fill="#aaccff"/>
    <circle cx="700" cy="160" r="0.6" fill="#ffffff"/>
    <circle cx="830" cy="185" r="0.5" fill="#ffeedd"/>
    <circle cx="950" cy="165" r="0.7" fill="#aaccff"/>
    <circle cx="60" cy="280" r="0.5" fill="#ffffff"/>
    <circle cx="150" cy="300" r="0.6" fill="#aaccff"/>
    <circle cx="250" cy="290" r="0.5" fill="#ffeedd"/>
    <circle cx="380" cy="275" r="0.7" fill="#ffffff"/>
    <circle cx="500" cy="295" r="0.5" fill="#aaccff"/>
    <circle cx="620" cy="285" r="0.6" fill="#ffffff"/>
    <circle cx="750" cy="305" r="0.5" fill="#ffeedd"/>
    <circle cx="870" cy="270" r="0.7" fill="#aaccff"/>
    <circle cx="980" cy="295" r="0.5" fill="#ffffff"/>
    <circle cx="100" cy="400" r="0.5" fill="#aaccff"/>
    <circle cx="230" cy="420" r="0.6" fill="#ffffff"/>
    <circle cx="360" cy="390" r="0.5" fill="#ffeedd"/>
    <circle cx="480" cy="410" r="0.7" fill="#aaccff"/>
    <circle cx="600" cy="430" r="0.5" fill="#ffffff"/>
    <circle cx="720" cy="395" r="0.6" fill="#ffeedd"/>
    <circle cx="840" cy="415" r="0.5" fill="#aaccff"/>
    <circle cx="960" cy="405" r="0.7" fill="#ffffff"/>
    <circle cx="75" cy="500" r="0.5" fill="#ffffff"/>
    <circle cx="195" cy="520" r="0.6" fill="#aaccff"/>
    <circle cx="315" cy="490" r="0.5" fill="#ffeedd"/>
    <circle cx="435" cy="510" r="0.7" fill="#ffffff"/>
    <circle cx="555" cy="485" r="0.5" fill="#aaccff"/>
    <circle cx="675" cy="505" r="0.6" fill="#ffffff"/>
    <circle cx="795" cy="525" r="0.5" fill="#ffeedd"/>
    <circle cx="915" cy="495" r="0.7" fill="#aaccff"/>
    <circle cx="55" cy="560" r="0.5" fill="#ffffff"/>
    <circle cx="280" cy="555" r="0.6" fill="#aaccff"/>
    <circle cx="520" cy="570" r="0.5" fill="#ffffff"/>
    <circle cx="760" cy="550" r="0.7" fill="#ffeedd"/>
    <circle cx="980" cy="565" r="0.5" fill="#aaccff"/>
  </g>

  <!-- Star field - mid layer -->
  <g opacity="0.5">
    <circle cx="90" cy="60" r="1.0" fill="#ffffff"/>
    <circle cx="250" cy="140" r="0.9" fill="#ffeedd"/>
    <circle cx="430" cy="70" r="1.1" fill="#aaccff"/>
    <circle cx="600" cy="120" r="0.8" fill="#ffffff"/>
    <circle cx="780" cy="55" r="1.0" fill="#ffeedd"/>
    <circle cx="930" cy="100" r="0.9" fill="#aaccff"/>
    <circle cx="140" cy="250" r="1.0" fill="#ffffff"/>
    <circle cx="350" cy="220" r="0.8" fill="#aaccff"/>
    <circle cx="550" cy="260" r="1.1" fill="#ffffff"/>
    <circle cx="750" cy="230" r="0.9" fill="#ffeedd"/>
    <circle cx="900" cy="200" r="1.0" fill="#aaccff"/>
    <circle cx="180" cy="370" r="0.9" fill="#ffffff"/>
    <circle cx="400" cy="340" r="1.0" fill="#ffeedd"/>
    <circle cx="620" cy="360" r="0.8" fill="#aaccff"/>
    <circle cx="800" cy="330" r="1.1" fill="#ffffff"/>
    <circle cx="950" cy="380" r="0.9" fill="#ffeedd"/>
    <circle cx="110" cy="470" r="1.0" fill="#aaccff"/>
    <circle cx="330" cy="450" r="0.8" fill="#ffffff"/>
    <circle cx="540" cy="480" r="1.0" fill="#ffeedd"/>
    <circle cx="710" cy="460" r="0.9" fill="#aaccff"/>
    <circle cx="880" cy="440" r="1.1" fill="#ffffff"/>
  </g>

  <!-- Star field - bright foreground stars with glow -->
  <g filter="url(#starGlow)" opacity="0.8">
    <circle cx="160" cy="95" r="1.4" fill="#ffffff"/>
    <circle cx="380" cy="130" r="1.2" fill="#aaccff"/>
    <circle cx="650" cy="80" r="1.5" fill="#ffffff"/>
    <circle cx="850" cy="155" r="1.3" fill="#ffeedd"/>
    <circle cx="290" cy="310" r="1.4" fill="#aaccff"/>
    <circle cx="700" cy="280" r="1.2" fill="#ffffff"/>
    <circle cx="480" cy="380" r="1.5" fill="#ffeedd"/>
    <circle cx="860" cy="420" r="1.3" fill="#aaccff"/>
    <circle cx="220" cy="500" r="1.2" fill="#ffffff"/>
    <circle cx="600" cy="530" r="1.4" fill="#ffeedd"/>
  </g>

  <!-- Bright twinkling stars (largest) -->
  <g opacity="0.95">
    <circle cx="200" cy="65" r="1.8" fill="#ffffff" filter="url(#starGlow)"/>
    <circle cx="820" cy="110" r="2.0" fill="#aaccff" filter="url(#starGlow)"/>
    <circle cx="500" cy="180" r="1.6" fill="#ffffff" filter="url(#starGlow)"/>
    <circle cx="350" cy="440" r="1.8" fill="#ffeedd" filter="url(#starGlow)"/>
    <circle cx="750" cy="350" r="1.7" fill="#ffffff" filter="url(#starGlow)"/>
  </g>

  <!-- Spaceship silhouette (simplified, centered) -->
  <g transform="translate(512, 200) scale(0.9)">
    <!-- Engine glow -->
    <ellipse cx="0" cy="45" rx="25" ry="35" fill="url(#engineGlow)"/>
    <!-- Ship body -->
    <path d="M0,-35 L-18,10 L-22,30 L-10,38 L10,38 L22,30 L18,10 Z" 
          fill="#1a2a4a" stroke="#35e6c9" stroke-width="1.5" opacity="0.9"/>
    <!-- Cockpit -->
    <path d="M0,-28 L-8,-5 L8,-5 Z" fill="#35e6c9" opacity="0.7"/>
    <!-- Wing details -->
    <line x1="-14" y1="15" x2="-8" y2="35" stroke="#7c5cff" stroke-width="0.8" opacity="0.6"/>
    <line x1="14" y1="15" x2="8" y2="35" stroke="#7c5cff" stroke-width="0.8" opacity="0.6"/>
    <!-- Engine flames -->
    <path d="M-6,38 L0,55 L6,38" fill="#35e6c9" opacity="0.8"/>
    <path d="M-3,38 L0,48 L3,38" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Decorative stars around ship -->
  <circle cx="430" cy="175" r="3" fill="#ffcf6b" opacity="0.9"/>
  <circle cx="595" cy="165" r="2.5" fill="#ffcf6b" opacity="0.8"/>
  <circle cx="460" cy="235" r="2" fill="#ffcf6b" opacity="0.7"/>
  <circle cx="565" cy="240" r="2.2" fill="#ffcf6b" opacity="0.75"/>

  <!-- Title: ASTRO -->
  <text x="512" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" filter="url(#titleGlow)" letter-spacing="12">ASTRO</text>

  <!-- Title: RECOLTE -->
  <text x="512" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold" fill="#35e6c9" filter="url(#titleGlow)" letter-spacing="8">RECOLTE</text>

  <!-- Decorative line under title -->
  <line x1="340" y1="430" x2="684" y2="430" stroke="#35e6c9" stroke-width="1.5" opacity="0.4"/>

  <!-- Subtitle -->
  <text x="512" y="465" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#96a3cc" letter-spacing="4">ARCADE SPATIAL</text>

  <!-- Credit (pas de numero de version en dur ici : il vit dans project.godot) -->
  <text x="512" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a5a70" letter-spacing="2">multidevsn</text>
</svg>
