# Build & publish a signed Android APK whenever a tag "v*" is pushed.
#
# Setup required (one time), in GitHub > Settings > Secrets and variables >
# Actions, add these repository secrets:
#   ANDROID_KEYSTORE_BASE64   -> `base64 -w0 astrorecolte-release.keystore`
#   ANDROID_KEYSTORE_ALIAS    -> alias used when the keystore was created
#   ANDROID_KEYSTORE_PASSWORD -> keystore/key password
#
# Never commit the .keystore file or its password to the repo — this
# workflow injects them at build time only.
#
# Usage:
#   git tag v1.23.0 && git push origin v1.23.0
# The workflow exports the APK and attaches it to a new GitHub Release.

name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

env:
  GODOT_VERSION: "4.7"

jobs:
  release:
    name: Export Android APK
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.7
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare export templates & config
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p build
          echo "$KEYSTORE_BASE64" | base64 --decode > /root/release.keystore

      - name: Inject signing config into export_presets.cfg
        env:
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          sed -i 's|keystore/release=".*"|keystore/release="/root/release.keystore"|' export_presets.cfg
          sed -i "s|keystore/release_user=\".*\"|keystore/release_user=\"$KEYSTORE_ALIAS\"|" export_presets.cfg
          sed -i "s|keystore/release_password=\".*\"|keystore/release_password=\"$KEYSTORE_PASSWORD\"|" export_presets.cfg

      - name: Export release APK
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-release "Android" build/android/AstroRecolte.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstroRecolte-apk
          path: build/android/AstroRecolte.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/android/AstroRecolte.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
