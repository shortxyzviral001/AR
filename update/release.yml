# GitHub Actions workflow template for AstroRecolte releases
# Copie ce fichier dans .github/workflows/release.yml sur ton repo
#
# Usage:
#   1. Pousse l'APK dans le repo
#   2. Crée un tag (ex: v1.9.0)
#   3. Le workflow crée automatiquement une GitHub Release avec l'APK
#
# Ou manuellement: Actions > Release > Run workflow > tag name

name: Create Release

on:
  push:
	tags:
	  - 'v*'

jobs:
  release:
	runs-on: ubuntu-latest
	permissions:
	  contents: write
	steps:
	  - uses: actions/checkout@v4

	  - name: Create GitHub Release
		uses: softprops/action-gh-release@v2
		with:
		  files: AstroRecolte.apk
		  generate_release_notes: true
		  draft: false
		  prerelease: false
		env:
		  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
